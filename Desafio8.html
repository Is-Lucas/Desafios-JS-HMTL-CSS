<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 8</title>
    <link rel="stylesheet" href="css/desafio8.css">
</head>

<body>
    <h1>8° Desafio de pratica de DOM JS</h1>
    <form action="#" class="forms">
        <label for="fnome">Insira o nome </label>
        <input type="text" id="fnome" name="nome" required placeholder="Ex: João Silva">
        <label for="idade">Insira sua idade</label>
        <input type="number" id="idade" name="idade" required placeholder="Ex: 10" min="1"  step="1">
        <button type="submit" id="btn-enviar">Enviar</button>
    </form>
    <div class ="resultado">
        <h1 id="mensagem">Verificador de Idade</h1>
        <p id="mensagem1"></p>
        <p id="mensagem2"></p>
        <p id="mensagem3"></p>
        
    </div>


    <script src="js/desafio8.js"></script>
</body>

</html>
