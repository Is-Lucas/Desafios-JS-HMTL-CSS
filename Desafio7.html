<body>
    <h1>7° Desafio de pratica de DOM JS</h1>
    <form action="#" class="forms">
        <label for="fnome">Insira o nome do filme</label>
        <input type="text" id="fnome" name="nome" required placeholder="Ex: Harry Potter">
        <label for="nota">Insira a nota desse filme</label>
        <input type="number" id="nota" name="nota" required placeholder="Ex: 10" min="0" max="10" step="1">
        <button type="submit" id="btn-enviar">Enviar</button>
    </form>
    <div class ="resultado">
        <h1 id="mensagem">Resultado</h1>
        <p id="mensagem1"></p>
        
    </div>
