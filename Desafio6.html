<body>
    <h1>6° Desafio de pratica de DOM JS</h1>
    <form action="#" class="forms">
        <label for="fnome">Insira seu nome completo</label>
        <input type="text" id="fnome" name="nome" required placeholder="Insira seu nome...">
        <label for="idade">Insira sua Idade</label>
        <input type="number" id="idade" name="idade" required placeholder="Insira sua idade..." min="0" max="99" step="1">
        <button type="submit" id="btn-enviar">Enviar</button>
    </form>
    <div class ="resultado">
        <h1 id="mensagem">Resultado</h1>

    </div>
